plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  # The oldest Ruby the gem supports (required_ruby_version), not the one in .tool-versions
  TargetRubyVersion: 3.3
  NewCops: enable

# Do not enforce documentation
Style/Documentation:
  Enabled: false

# Matching big hashes
RSpec/ExampleLength:
  Enabled: false
